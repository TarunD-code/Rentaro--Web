<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Payment Receipt — Rentora</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; padding: 32px 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .body { padding: 32px 24px; }
        .success-icon { text-align: center; font-size: 48px; margin-bottom: 16px; }
        .receipt-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .receipt-table td { padding: 10px 0; border-bottom: 1px solid #eee; }
        .receipt-table td:first-child { color: #888; font-size: 13px; }
        .receipt-table td:last-child { text-align: right; font-weight: 600; }
        .amount-row td { font-size: 18px; color: #27ae60; }
        .footer { background: #f8f9fa; padding: 20px 24px; text-align: center; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Payment Successful ✓</h1>
        </div>
        <div class="body">
            <div class="success-icon">✅</div>
            <p>Hi <strong>{{tenant_name}}</strong>,</p>
            <p>Your payment has been received successfully.</p>
            <table class="receipt-table">
                <tr><td>Transaction ID</td><td>TXN-{{transaction_id}}</td></tr>
                <tr class="amount-row"><td>Amount</td><td>₹{{amount}}</td></tr>
                <tr><td>Payment Method</td><td>{{payment_method}}</td></tr>
                <tr><td>Date</td><td>{{paid_at}}</td></tr>
                <tr><td>Property</td><td>{{property_title}}</td></tr>
            </table>
        </div>
        <div class="footer">
            <p>© 2026 Rentora. This is an auto-generated receipt.</p>
        </div>
    </div>
</body>
</html>
