version: '3.8'

services:
  # ── INFRASTRUCTURE SERVICES ───────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: rentora_postgres
    environment:
      POSTGRES_DB: rentora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rentora_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rentora_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentora_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rentora_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rentora_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management portal dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rentora_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_listener 5672"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── API GATEWAY ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: rentora_gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:rentora_secure_password@postgres:5432/rentora
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - ENV=production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rentora_network
    restart: on-failure

  # ── MICROSERVICES ──────────────────────────────────────────────────────────
  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth_service
    container_name: rentora_auth_service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:rentora_secure_password@postgres:5432/rentora?currentSchema=auth
      - REDIS_URL=redis://redis:6379/0
      - ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rentora_network
    restart: on-failure

  profile_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: profile_service
    container_name: rentora_profile_service
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:rentora_secure_password@postgres:5432/rentora?currentSchema=profile
      - REDIS_URL=redis://redis:6379/0
      - ENV=production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rentora_network
    restart: on-failure

  property_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: property_service
    container_name: rentora_property_service
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:rentora_secure_password@postgres:5432/rentora?currentSchema=property
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - ENV=production
      - GEO_AMENITY_SERVICE_URL=http://geo_amenity_service:8000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rentora_network
    restart: on-failure

  payment_service:
