name: Rentora Frontend CI

on:
  push:
    branches: [ main, develop, feature/sprint16 ]
  pull_request:
    branches: [ main, develop, feature/sprint16 ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm install
      working-directory: frontend
    - name: Build
      run: npm run build
      working-directory: frontend
    - name: Lint
      run: npm run lint
      working-directory: frontend
    - name: Install Communication Service deps
      run: npm install
      working-directory: communication_service
    - name: Build Communication Service
      run: npm run build
      working-directory: communication_service
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Backend Tests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pytest tests/test_onboarding_service.py -v
    - name: Auth Guard Tests
      uses: cypress-io/github-action@v6
      with:
        working-directory: frontend
        spec: cypress/e2e/auth_guard.cy.ts
        start: npm run dev
        wait-on: 'http://localhost:5173'
        
    - name: Onboarding E2E Tests
      uses: cypress-io/github-action@v6
      with:
        working-directory: frontend
        spec: cypress/e2e/sprint13_onboarding.cy.ts
        start: npm run dev
        wait-on: 'http://localhost:5173'
