<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family:'Helvetica Neue',Arial,sans-serif;margin:0;padding:0;background:#f8f9fa;">
  <div style="max-width:600px;margin:0 auto;background:#fff;">
    <div style="background:linear-gradient(135deg,#27ae60,#2ecc71);padding:30px;text-align:center;">
      <h1 style="color:#fff;margin:0;font-size:22px;">Agreement Signed &#10004;</h1>
      <p style="color:rgba(255,255,255,0.8);margin:5px 0 0;">All Parties Have Signed</p>
    </div>
    <div style="padding:30px;">
      <p>Dear {{ recipient_name }},</p>
      <p>Great news! Agreement <strong>AGR-{{ agreement_id }}</strong> has been fully signed by both parties.</p>
      <div style="background:#f0faf0;border:2px solid #27ae60;border-radius:8px;padding:20px;margin:20px 0;text-align:center;">
        <p style="margin:0;font-size:16px;font-weight:700;color:#27ae60;">Agreement Active</p>
        <p style="margin:6px 0 0;color:#666;">Effective: {{ start_date }}</p>
      </div>
      <p>You can download the signed agreement from your dashboard.</p>
    </div>
    <div style="padding:20px;text-align:center;font-size:12px;color:#999;border-top:1px solid #eee;">Automated email from Rentora.</div>
  </div>
</body>
</html>
